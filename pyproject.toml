[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "donkey-punch-recognizer"
version = "2.0.0"
description = "OSINT de números telefónicos: análisis de línea, operadora, reputación, VoIP/premium, presencia pública y búsqueda web multi-motor."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cha0smagick" }]
keywords = ["osint", "phonenumbers", "recon", "security", "phone"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "phonenumbers>=8.13",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.urls]
Homepage = "https://github.com/Cha0smagick/Donkey-punch"
Changelog = "https://github.com/Cha0smagick/Donkey-punch/blob/main/CHANGELOG.md"

[project.scripts]
dp = "dp.cli:main"

[tool.setuptools]
packages = ["dp"]
